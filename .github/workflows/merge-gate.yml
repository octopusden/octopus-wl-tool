name: Merge Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: only the security job gets security-events, and it lists every
# scope it needs - a job-level block replaces the set rather than extending it.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  quality:
    uses: ./.github/workflows/quality-gates.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-reports.yml

  gradle-scripts:
    name: buildSrc (gradle-scripts)
    # gradle-scripts/buildSrc is a separate Gradle project, outside the Maven reactor the
    # other jobs build, that resolves wl-tool/validation by version rather than as reactor
    # modules. Nothing else compiles it, so a signature change here can merge green and only
    # break downstream consumers' WL Validation builds once they pick up the new version -
    # which is exactly what happened in #22.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Two JDKs on purpose: the Maven build targets 8, the same as build.yml, while the Gradle
      # side runs 17 to match what the TeamCity agents set as JAVA_HOME for this same build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            8
      - name: Install wl-tool and validation to the local Maven repo
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: mvn -q install
      - name: Build buildSrc against this branch's wl-tool
        working-directory: gradle-scripts
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -euo pipefail
          # help:evaluate's default (old) plugin version drops -DforceStdout's output under -q;
          # 3.4.0 is pinned because it doesn't.
          VERSION="$(mvn -q -f ../wl-tool/pom.xml org.apache.maven.plugins:maven-help-plugin:3.4.0:evaluate -Dexpression=project.version -DforceStdout)"
          # The full root build (not just :buildSrc:build) so this also covers gradle-scripts'
          # own wlValidator task - a signature mismatch scoped to buildSrc alone isn't the only
          # way this has broken; a wl-tool version bump once broke the root build's own
          # dependency resolution (jackson pulled in bytecode Gradle 6.8.1 can't parse) in a way
          # -p buildSrc wouldn't have caught either.
          ./gradlew build --no-daemon -P"octopus-wl-tool.version=${VERSION}"

  gate-merge:
    name: gate/merge
    if: ${{ always() }}
    needs:
      - build
      - quality
      - security
      - gradle-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Validate gate results
        shell: bash
        run: |
          set -euo pipefail

          results='${{ toJson(needs) }}'
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"${results}")"

          {
            echo "### Merge gate results"
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<<"${results}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${failed}" ]]; then
            echo "Merge gate failed:"
            echo "${failed}"
            exit 1
          fi

          echo "Merge gate passed."
