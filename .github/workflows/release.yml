name: Maven Release

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: 'Which part of the version this release increments'
        type: choice
        default: patch
        # only the three the base workflow can release: its version parser accepts vX.Y.Z and
        # rejects the -N suffix every pre* level produces, so those would fail before publishing
        options:
          - patch
          - minor
          - major

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@v3.0.3
    with:
      java-version: '8'
      flow-type: public
      # a released version is immutable, so the level is chosen at dispatch rather than
      # defaulted in code: a change that breaks a consumer's build must not ship as a patch
      increment-version-level: ${{ inputs.increment-version-level }}
    secrets: inherit
