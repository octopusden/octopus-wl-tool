name: Check for artifact and register release

on:
  workflow_run:
    workflows: ["Maven Release"]
    types:
      - completed

# The registration itself runs on OCTOPUS_GITHUB_TOKEN; GITHUB_TOKEN is only used to
# resolve which version the release built, which is a read.
permissions:
  contents: read

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-check-and-register-release.yml@v3.0.0
    if:  "${{ github.event.workflow_run.conclusion == 'success' }}"
    with:
      artifact-pattern: "octopus/tools/wl/wl-tool/_VER_/wl-tool-_VER_.jar"
    secrets: inherit
